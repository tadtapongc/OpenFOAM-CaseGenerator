[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "rapidfoam"
version = "1.0.0"
description = "Rapid external aerodynamics and OpenFOAM automation suite for Rapidamente Formula Student"
authors = [
    { name = "Tadtapong C. (Rapidamente Formula Student)", email = "tadtapong2549@gmail.com" }
]
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "paramiko>=3.0.0",
    "python-multipart>=0.0.6",
]

[project.scripts]
rapidfoam = "rapidfoam.cli:setup_main"
rapidfoam-setup = "rapidfoam.cli:setup_main"
rapidfoam-forces = "rapidfoam.cli:forces_main"
rapidfoam-monitor = "rapidfoam.postproc.convergence_monitor:main"
rapidfoam-studio = "rapidfoam.web.server:main"
rapidfoam-web = "rapidfoam.web.server:main"
# Backward-compatible aliases
cfd-setup = "rapidfoam.cli:setup_main"
cfd-forces = "rapidfoam.cli:forces_main"
cfd-monitor = "rapidfoam.postproc.convergence_monitor:main"
cfd-web = "rapidfoam.web.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/rapidfoam"]

