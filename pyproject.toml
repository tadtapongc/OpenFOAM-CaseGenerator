[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "cfd-gen"
version = "1.0.0"
description = "Geometry-agnostic OpenFOAM case generator for external aerodynamics"
requires-python = ">=3.9"
dependencies = []

[project.optional-dependencies]
plot = ["matplotlib>=3.5"]
web = [
    "fastapi>=0.100.0",
    "uvicorn>=0.22.0",
    "paramiko>=3.0.0",
    "python-multipart>=0.0.6",
]

[project.scripts]
cfd-setup = "cfd_gen.cli:setup_main"
cfd-forces = "cfd_gen.cli:forces_main"
cfd-monitor = "cfd_gen.postproc.convergence_monitor:main"
cfd-web = "cfd_gen.web.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/cfd_gen"]

